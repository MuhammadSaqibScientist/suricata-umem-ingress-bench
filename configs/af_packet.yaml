%YAML 1.1
---
# Suricata AF_PACKET Ingress Pipeline Configuration
# Tuned for Parameter Sweeping (tpacket_v3 ring/block sizes)

vars:
  address-groups:
    HOME_NET: "[192.168.10.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
  port-groups:
    HTTP_PORTS: "80"

stats:
  enabled: yes
  interval: 1

outputs:
  - stats:
      enabled: yes
      filename: stats.log
      totals: yes
      threads: yes

  - fast:
      enabled: yes
      filename: fast.log

af-packet:
  - interface: veth_rx
    threads: 2
    tpacket-v3: yes
    ring-size: 2048
    block-size: 32768
    max-pending-packets: 65535
    cluster-id: 99
    cluster-type: cluster_flow
    checksum-checks: no
    copy-mode: ips
    copy-iface: none


threading:
  set-cpu-affinity: no
  detect-thread-ratio: 1.0

# Basic alert rules location
default-rule-path: /etc/suricata/rules
rule-files:
  - suricata.rules
