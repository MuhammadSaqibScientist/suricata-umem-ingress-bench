%YAML 1.1
---
vars:
  address-groups:
    HOME_NET: "[192.168.10.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
  port-groups:
    HTTP_PORTS: "80"

stats:
  enabled: yes
  interval: 1

outputs:
  - stats:
      enabled: yes
      filename: stats.log
      totals: yes
      threads: yes
  - fast:
      enabled: yes
      filename: fast.log

af-xdp:
  - interface: veth_rx
    force-xdp-mode: skb
    busy-poll-budget: 64
    mem-fill-ring-size: 2048
    mem-completion-ring-size: 2048
    rx-ring-size: 2048
    tx-ring-size: 2048
    force-bind-mode: copy
    checksum-checks: no

threading:
  set-cpu-affinity: no
  detect-thread-ratio: 1.0

default-rule-path: /etc/suricata/rules
rule-files:
  - suricata.rules
